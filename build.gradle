plugins {
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
}

def requestedTarget = providers.gradleProperty('target_version').orNull
if (requestedTarget != null) {
    def entries = new groovy.json.JsonSlurper().parse(rootProject.file('versions/matrix.json'))
    def target = entries.find { it.minecraft == requestedTarget }
    if (target == null) {
        throw new GradleException("Unknown target_version '${requestedTarget}'. See versions/matrix.json.")
    }
    allprojects { configuredProject ->
        configuredProject.ext.minecraft_version = target.minecraft
        configuredProject.ext.java_version = target.java.toString()
        configuredProject.ext.fabric_loader_version = target.fabricLoader
        configuredProject.ext.fabric_loader_range = target.fabricLoaderRange
        configuredProject.ext.neoforge_version = target.neoForge
        configuredProject.ext.neoforge_loader_range = target.neoForgeLoaderRange
    }
    rootProject.version = "0.1.0+${target.minecraft}"
}

architectury { minecraft = minecraft_version }

subprojects {
    apply plugin: 'com.gradleup.shadow'
    def unobfuscatedDistribution = minecraft_version.startsWith('26.')
    apply plugin: unobfuscatedDistribution
        ? 'dev.architectury.loom-no-remap'
        : 'dev.architectury.loom'

    loom { silentMojangMappingsLicense() }
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        if (!unobfuscatedDistribution) mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'architectury-plugin'

    group = maven_group
    version = rootProject.version

    java {
        sourceCompatibility = JavaVersion.toVersion(java_version)
        targetCompatibility = JavaVersion.toVersion(java_version)
        withSourcesJar()
    }

    base { archivesName = archives_base_name }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    tasks.withType(Jar).configureEach {
        from rootProject.file('LICENSE')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(Test).configureEach { useJUnitPlatform() }
}
