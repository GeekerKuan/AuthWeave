name: publish-modrinth

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.1
        required: true
        default: v0.1.1

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { minecraft: '1.21', java: '21' }
          - { minecraft: '1.21.1', java: '21' }
          - { minecraft: '1.21.2', java: '21' }
          - { minecraft: '1.21.3', java: '21' }
          - { minecraft: '1.21.4', java: '21' }
          - { minecraft: '1.21.5', java: '21' }
          - { minecraft: '1.21.6', java: '21' }
          - { minecraft: '1.21.7', java: '21' }
          - { minecraft: '1.21.8', java: '21' }
          - { minecraft: '1.21.9', java: '21' }
          - { minecraft: '1.21.10', java: '21' }
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1', java: '25' }
          - { minecraft: '26.1.1', java: '25' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
    runs-on: windows-latest
    name: Publish Minecraft ${{ matrix.minecraft }}
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: .\gradlew.bat clean build "-Ptarget_version=$env:TARGET_VERSION" --stacktrace
        env:
          TARGET_VERSION: ${{ matrix.minecraft }}
      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: |
            fabric/build/libs/authweave-fabric-0.1.1+${{ matrix.minecraft }}.jar
            neoforge/build/libs/authweave-neoforge-0.1.1+${{ matrix.minecraft }}.jar
          name: AuthWeave ${{ env.RELEASE_VERSION }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ env.RELEASE_VERSION }}+${{ matrix.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            fabric
            neoforge
          environment: client
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
          fail-mode: fail
