name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { minecraft: '1.21', java: '21' }
          - { minecraft: '1.21.1', java: '21' }
          - { minecraft: '1.21.2', java: '21' }
          - { minecraft: '1.21.3', java: '21' }
          - { minecraft: '1.21.4', java: '21' }
          - { minecraft: '1.21.5', java: '21' }
          - { minecraft: '1.21.6', java: '21' }
          - { minecraft: '1.21.7', java: '21' }
          - { minecraft: '1.21.8', java: '21' }
          - { minecraft: '1.21.9', java: '21' }
          - { minecraft: '1.21.10', java: '21' }
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1', java: '25' }
          - { minecraft: '26.1.1', java: '25' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
    runs-on: windows-latest
    name: Minecraft ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat clean build -Ptarget_version=${{ matrix.minecraft }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: server-login-profiles-${{ matrix.minecraft }}
          path: |
            fabric/build/libs/server-login-profiles-fabric-0.1.0+${{ matrix.minecraft }}.jar
            neoforge/build/libs/server-login-profiles-neoforge-0.1.0+${{ matrix.minecraft }}.jar
          if-no-files-found: error
