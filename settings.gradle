pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

rootProject.name = 'authweave'
include 'common'

def requestedPlatforms = providers.gradleProperty('enabled_platforms')
    .orElse('fabric,neoforge').get().split(',').collect { it.trim() }
if ('fabric' in requestedPlatforms) include 'fabric'
if ('neoforge' in requestedPlatforms) include 'neoforge'
