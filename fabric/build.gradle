architectury {
    platformSetupLoomIde()
    fabric()
}

def requiresProductionRemap = !minecraft_version.startsWith('26.')

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

processResources {
    from(project(':common').file('src/main/resources/assets')) {
        into 'assets'
    }
    inputs.properties(rootProject.properties.findAll { it.key in [
        'mod_id', 'mod_name', 'mod_description', 'mod_author', 'mod_license',
        'version', 'minecraft_version', 'java_version', 'fabric_loader_range'
    ]})
    filesMatching('fabric.mod.json') {
        expand(rootProject.properties)
    }
}

jar {
    archiveAppendix = project.name
    archiveClassifier = 'dev'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from zipTree(jar.archiveFile)
    configurations = [project.configurations.shadowCommon]
    archiveAppendix = project.name
    if (requiresProductionRemap) archiveClassifier = 'dev-shadow'
    else archiveClassifier.unset()
}

if (requiresProductionRemap) {
    remapJar {
        dependsOn shadowJar
        inputFile.set(shadowJar.archiveFile)
        archiveAppendix = project.name
        archiveClassifier.unset()
    }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(requiresProductionRemap ? remapJar : shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(requiresProductionRemap ? remapJar : shadowJar)
    }
}
