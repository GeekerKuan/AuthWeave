architectury { common enabled_platforms.split(',') }

def usesIntermediaryMappings = !minecraft_version.startsWith('26.')

if (usesIntermediaryMappings) {
    loom {
        mixin {
            useLegacyMixinAp = true
            defaultRefmapName.set('serverloginprofiles-common-refmap.json')
        }
    }
}

def legacyMinecraft = minecraft_version == '1.21' || (
    minecraft_version.startsWith('1.21.')
        && minecraft_version.substring('1.21.'.length()).toInteger() <= 8
)

sourceSets.main.java.srcDir(legacyMinecraft ? 'src/legacy/java' : 'src/modern/java')

if (!legacyMinecraft) {
    sourceSets.main.java.srcDir(
        minecraft_version.startsWith('26.')
            ? 'src/skin-mojang/java'
            : 'src/skin-intermediary/java'
    )
}

def legacyNbt = minecraft_version == '1.21' || minecraft_version == '1.21.1'
    || minecraft_version == '1.21.2' || minecraft_version == '1.21.3'
    || minecraft_version == '1.21.4'
sourceSets.main.java.srcDir(legacyNbt ? 'src/nbt-legacy/java' : 'src/nbt-modern/java')

processResources {
    inputs.property('mixin_java_level', "JAVA_${java_version}")
    inputs.property('uses_intermediary_mappings', usesIntermediaryMappings)
    filesMatching('serverloginprofiles.mixins.json') {
        expand(
            mixin_java_level: "JAVA_${java_version}",
            mixin_refmap_line: usesIntermediaryMappings
                ? '"refmap": "serverloginprofiles-common-refmap.json",\n  '
                : ''
        )
    }
}

configurations { shadowCommon }

dependencies {
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

jar {
    archiveAppendix = project.name
    archiveClassifier = 'dev'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from zipTree(jar.archiveFile)
    configurations = [project.configurations.shadowCommon]
    archiveAppendix = project.name
    archiveClassifier.unset()
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
